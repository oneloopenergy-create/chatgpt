rules:
- id: EE-001
  trigger: LV IES >=30 and <1500 kVA
  when:
    all:
    - field: connection_phase
      op: eq
      value: LV
    - field: aggregate_inverter_kva
      op: gte
      value: 30
    - field: aggregate_inverter_kva
      op: lt
      value: 1500
  outcome: Within PDI 5000 LV protection scope; classify connection per Table 1
  source: END-PDIA
  clause: PDI 5000 Part A 1.1.1 Table 1
  confidence: Verified source
  action: classify_lv_protection
  flag: lv_protection_scope
  engineering_review: Review
  severity: warning
- id: EE-002
  trigger: LV IES >500 kVA
  when:
    all:
    - field: connection_phase
      op: eq
      value: LV
    - field: aggregate_inverter_kva
      op: gt
      value: 500
  outcome: Protection review consultation with Endeavour Energy (secondary systems)
  source: END-PDIA
  clause: PDI 5000 Part A 1.1.1
  confidence: Verified source
  action: require_protection_consultation
  flag: protection_consultation_required
  engineering_review: Review
  severity: warning
- id: EE-003
  trigger: ESS present
  when:
    field: bess_pcs_kva
    op: gt
    value: 0
  outcome: Include ESS inverter in aggregate inverter nameplate (GridEasy aggregate
    kVA already sums PV inverters and BESS PCS)
  source: END-PDIA
  clause: PDI 5000 Part A 4.4
  confidence: Verified source
  action: check_aggregate_includes_ess
  engineering_review: Review
  severity: info

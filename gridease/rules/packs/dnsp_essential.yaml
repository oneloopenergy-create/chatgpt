rules:
- id: ES-R008
  trigger: HV embedded generator (NSW Data Master R008)
  when:
    field: connection_phase
    op: eq
    value: HV
  outcome: Retrieve HV technical, protection, SCADA and connection process documents
    (CEOP8079, CERM1135, CEOS7903, CEOP8012); allow 2–3 years overall (indicative)
  source: ESS-INDEX;ESS-HV
  clause: Official index
  confidence: Index verified; clauses pending
  action: require_hv_documents
  flag: hv_review
  engineering_review: Not executable
  severity: warning
- id: ESS-HV-001
  trigger: HV EG; connection agreement signed on or after 2027-01-01 (or date unknown)
  when:
    all:
    - field: connection_phase
      op: eq
      value: HV
    - any:
      - field: connection_agreement_date
        op: missing
      - field: connection_agreement_date
        op: gte
        value: '2027-01-01'
  outcome: SCADA remote terminal unit and control interface required
  source: ESS-SCADA
  clause: Official page
  confidence: Official page checked
  action: require_scada_rtu
  flag: scada_rtu_required
  engineering_review: 'Yes: alternative communications may be approved for smaller
    systems'
  severity: warning
  effective_from: '2027-01-01'
- id: ES-001
  trigger: HV EG <5 MW
  when:
    all:
    - field: connection_phase
      op: eq
      value: HV
    - any:
      - field: generation_kw
        op: missing
      - field: generation_kw
        op: lt
        value: 5000
  outcome: Confirm the current controlled version of CERM1135 before use (2021 original
    on file)
  source: ESS-CERM1135
  clause: Scope
  confidence: Version pending
  action: confirm_document_version
  flag: document_version_review
  engineering_review: Review
  severity: warning
